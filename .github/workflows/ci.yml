name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The published, prebuilt dsh-tools (and its cordis peer) powers the tests.
      - name: Install the DSH tool registry
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh-tools

      - name: Smoke test (load + register 6 tools + prompt section)
        run: node scripts/smoke.js

      - name: End-to-end loop test (perceive → checkpoint → rollback → verify → parity)
        run: node scripts/e2e-loop.mjs
